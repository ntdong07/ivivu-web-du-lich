                        </a></li>
                        <li><a class="a" href="http://127.0.0.1:5500/KHACH_SAN/index.html">Khách sạn</a></li>
                        <li><a class="a" href="http://127.0.0.1:5500/TOUR/index.html">Tours</a></li>
                        <li><a class="a" href="http://127.0.0.1:5500/VE_MAYBAY/index.html">Vé máy bay</a></li>
                        <li><a class="a" href="http://127.0.0.1:5500/VE_VUICHOI/index.html">Vé vui chơi</a></li>
                        <li><a class="a" href="http://127.0.0.1:5500/VE_TAU/index.html">Vé tàu</a></li>
                        <li>
                            <i class="ti-more-alt"></i>
                            <ul class="sub-nav">
                               
                                <li><a href="http://127.0.0.1:5500/Small_navigation/nav1/index.html">Bespoke</a></li>

                <div class="menu2">
                    <div class="box-menu1">
                        <i class="ti-user"></i>
                        <strong class="tk">Tài khoản
                            <!-- begin phần thêm -->
                        <div class="account">
                            <a class="now-dangky" href="http://127.0.0.1:5500/Dang_ky/index.html">

                            </a>
                            <p class="what">Quý khách đã có tài khoản?</p>

                        </div>
                        <!-- end phầm thêm -->
                        </strong>
                        <i class="ti-angle-down"></i>

                    <div class="box-menu2">
                        <h2><i class="ti-mobile"></i> 1900 1870</h2>
                        <p><i class="ti-time"></i> 7h30 <i class="ti-arrow-right"></i> 21h</p>

                    <div class="clear"></div>
                </div>
            </div>
        </div>
        <!-- end header -->
        <div id="content">
            <div class="content-selection">
                <!-- -- -->
                <div class="content-title">
                    <h4 class="dn">Đăng nhập</h4>
                    <a href=""><i class="ti-arrow-left icon-left"></i></a>
                </div>
                <!-- - -->

                <div class="content-thongtin">

                    <input id="mat-khau" class="input-thongtin" type="password" >
                </div>
                <!-- -- -->
                <div class="content-suport">

                    <a class="suport_link" href="">Đăng nhập bằng OTP</a>

                <button class="btn-dangnhap">Đăng nhập</button>

                    <hr class="the-hr">
                    <p class="min-title">Hoặc</p>
                </div>
                <div class="content-app">
                    <div class="app-block">
                        
                        <p><i class="icon-app ti-facebook"></i> Facebook</p>

                        <p><i class="icon-app ti-google"></i> Google</p>

            </div>
        </div>




        

    </div>

    















    <script>
        // 1. Tìm cái nút "Tài khoản" và cái hộp "Account"
        const btnTaiKhoan = document.querySelector('.box-menu1');
        const boxAccount = document.querySelector('.account');

        // 2. Lắng nghe sự kiện click vào nút "Tài khoản"
        btnTaiKhoan.addEventListener('click', function(event) {
            // toggle: Nếu chưa có class 'show' thì thêm vào (hiện), nếu có rồi thì xóa đi (ẩn)
            boxAccount.classList.toggle('show');
        });

        // 3. (Tính năng nâng cao) - Click vào bên trong hộp Account sẽ KHÔNG bị đóng
        boxAccount.addEventListener('click', function(event) {
            event.stopPropagation(); // Chặn sự kiện click lan ra ngoài
        });

        // 4. (Tính năng nâng cao) - Bấm ra khoảng trắng ngoài web thì tự động đóng hộp
        document.addEventListener('click', function(event) {
            if (!btnTaiKhoan.contains(event.target)) {
                boxAccount.classList.remove('show');
            }
        });
    </script>
</body>
</html>
